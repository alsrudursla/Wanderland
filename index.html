<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanderland</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=61503eb94f2c868e383de9347f24f56c&libraries=services"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f7f3ec;
      --cream-dark: #ede7da;
      --ink: #1e1a16;
      --ink-light: #6b5f52;
      --ink-faint: #b5a99a;
      --accent: #c0392b;
      --line: #d4c9b0;
    }

    body {
      background: var(--cream);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 42px;
      color: var(--ink);
      letter-spacing: 1px;
      line-height: 1;
    }

    .logo span {
      color: var(--accent);
    }

    .tagline {
      font-size: 13px;
      color: var(--ink-faint);
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    /* 메모지 카드 */
    .card {
      background: #fdfaf4;
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
      position: relative;
      box-shadow: 3px 4px 0 var(--cream-dark), 6px 8px 0 var(--line);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 32px;
      width: 1px;
      height: 100%;
      background: rgba(192, 57, 43, 0.15);
    }

    .section-title {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 20px;
      color: var(--ink);
      margin-bottom: 12px;
      padding-left: 20px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
      padding-left: 20px;
    }

    .chip {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 18px;
      padding: 4px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--line);
      background: transparent;
      color: var(--ink-light);
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
      line-height: 1.6;
    }

    .chip:hover { border-color: var(--ink-light); }

    .chip.on {
      background: var(--ink);
      border-color: var(--ink);
      color: #fdfaf4;
    }

    .chip.accent.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .divider {
      border: none;
      border-top: 1px dashed var(--line);
      margin: 4px 0 20px;
    }

    .find-btn {
      width: calc(100% - 20px);
      margin-left: 20px;
      padding: 14px;
      font-family: 'Nanum Pen Script', cursive;
      font-size: 22px;
      background: var(--ink);
      color: #fdfaf4;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: transform 0.1s, background 0.1s;
    }

    .find-btn:active { transform: scale(0.98); }
    .find-btn:hover { background: #2c2520; }

    /* 로딩 */
    .loading {
      display: none;
      text-align: center;
      padding: 32px 0;
      font-family: 'Nanum Pen Script', cursive;
      font-size: 22px;
      color: var(--ink-light);
    }

    .loading.show { display: block; }

    /* 정렬 바 */
    .sort-bar {
      display: none;
      justify-content: flex-end;
      gap: 8px;
      width: 100%;
      max-width: 380px;
      margin: 16px 0 8px;
    }

    .sort-bar.show { display: flex; }

    .sort-btn {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink-light);
      cursor: pointer;
      transition: all 0.15s;
    }

    .sort-btn.on {
      background: var(--ink);
      border-color: var(--ink);
      color: #fdfaf4;
    }

    /* 결과 카드들 */
    .results {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-card {
      background: #fdfaf4;
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 16px 18px;
      box-shadow: 2px 3px 0 var(--cream-dark);
      cursor: pointer;
      transition: transform 0.1s;
      animation: fadeUp 0.3s ease both;
    }

    .result-card:hover { transform: translateY(-2px); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-name {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 20px;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .result-meta {
      font-size: 12px;
      color: var(--ink-faint);
      margin-bottom: 8px;
    }

    .result-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--cream-dark);
      color: var(--ink-light);
    }

    .no-result {
      text-align: center;
      font-family: 'Nanum Pen Script', cursive;
      font-size: 22px;
      color: var(--ink-faint);
      padding: 32px 0;
    }

    /* 에러 */
    .error-msg {
      display: none;
      font-size: 13px;
      color: var(--accent);
      text-align: center;
      margin-top: 8px;
      padding-left: 20px;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Wander<span>land</span></div>
    <p class="tagline">오늘 카페 어디가지?</p>
  </header>

  <div class="card">
    <p class="section-title">🏷 어떤 카페?</p>
    <div class="chips" id="type-chips">
      <span class="chip on" data-value="카공">카공</span>
      <span class="chip" data-value="빵집">빵집</span>
      <span class="chip" data-value="조용한">조용한</span>
      <span class="chip" data-value="분위기">분위기</span>
      <span class="chip" data-value="데이트">데이트</span>
    </div>

    <hr class="divider">
    <p class="section-title">✏️ 이런 거 있으면 좋겠어</p>
    <div class="chips" id="feature-chips">
      <span class="chip accent" data-value="콘센트">콘센트</span>
      <span class="chip accent" data-value="주차">주차</span>
      <span class="chip accent" data-value="애견동반">애견</span>
      <span class="chip accent" data-value="야외">야외석</span>
    </div>

    <hr class="divider">
    <button class="find-btn" onclick="search()">찾아줘 →</button>
    <p class="error-msg" id="error-msg">위치 정보가 필요해요. 브라우저에서 허용해줘요!</p>
  </div>

  <div class="loading" id="loading">헤매는 중... 🗺</div>

  <div class="sort-bar" id="sort-bar">
    <button class="sort-btn on" id="sort-distance" onclick="sortBy('distance')">가까운 순</button>
    <button class="sort-btn" id="sort-rating" onclick="sortBy('rating')">리뷰 순</button>
  </div>

  <div class="results" id="results"></div>

<script>
  let currentPlaces = [];
  let currentSort = 'distance';

  // 칩 토글
  document.querySelectorAll('#type-chips .chip').forEach(chip => {
    chip.addEventListener('click', () => chip.classList.toggle('on'));
  });
  document.querySelectorAll('#feature-chips .chip').forEach(chip => {
    chip.addEventListener('click', () => chip.classList.toggle('on'));
  });

  function getSelectedChips(groupId) {
    return [...document.querySelectorAll(`#${groupId} .chip.on`)]
      .map(c => c.dataset.value);
  }

  function search() {
    const errorEl = document.getElementById('error-msg');
    errorEl.classList.remove('show');

    if (!navigator.geolocation) {
      errorEl.classList.add('show');
      return;
    }

    document.getElementById('loading').classList.add('show');
    document.getElementById('results').innerHTML = '';
    document.getElementById('sort-bar').classList.remove('show');

    navigator.geolocation.getCurrentPosition(pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      searchKakao(lat, lng);
    }, () => {
      document.getElementById('loading').classList.remove('show');
      errorEl.classList.add('show');
    });
  }

    async function searchKakao(lat, lng) {
        const types = getSelectedChips('type-chips');
        const features = getSelectedChips('feature-chips');
        const keyword = [...types, ...features, '카페'].join(' ');

        try {
            const res = await fetch(`/api/search?lat=${lat}&lng=${lng}&keyword=${encodeURIComponent(keyword)}`);
            const data = await res.json();

            document.getElementById('loading').classList.remove('show');

            if (data.places && data.places.length) {
                currentPlaces = data.places;
                currentSort = 'distance';
                document.getElementById('sort-bar').classList.add('show');
                renderResults(currentPlaces);
            } else {
                document.getElementById('results').innerHTML = '<p class="no-result">근처에 카페가 없어요 😢</p>';
            }
        } catch (e) {
            document.getElementById('loading').classList.remove('show');
            document.getElementById('results').innerHTML = '<p class="no-result">오류가 났어요 😢</p>';
        }
    }

  function sortBy(type) {
    currentSort = type;
    document.getElementById('sort-distance').classList.toggle('on', type === 'distance');
    document.getElementById('sort-rating').classList.toggle('on', type === 'rating');

    const sorted = [...currentPlaces].sort((a, b) => {
      if (type === 'distance') return parseInt(a.distance) - parseInt(b.distance);
      if (type === 'rating') return (parseFloat(b.rating) || 0) - (parseFloat(a.rating) || 0);
    });
    renderResults(sorted);
  }

    function renderResults(places) {
        const container = document.getElementById('results');
        container.innerHTML = '';

        if (!places.length) {
            container.innerHTML = '<p class="no-result">근처에 카페가 없어요 😢</p>';
            return;
        }

        places.forEach((place, i) => {
            const name = place.displayName?.text || '';
            const address = place.formattedAddress || '';
            const rating = place.rating ? `⭐ ${place.rating.toFixed(1)} (${place.userRatingCount}개)` : '';
            const url = place.googleMapsUri || '';
            const tags = getSelectedChips('type-chips').concat(getSelectedChips('feature-chips'));

            const card = document.createElement('div');
            card.className = 'result-card';
            card.style.animationDelay = `${i * 0.05}s`;
            card.innerHTML = `
            <div class="result-name">${name}</div>
            <div class="result-meta">${[rating, address].filter(Boolean).join(' · ')}</div>
            <div class="result-tags">
                ${tags.map(t => `<span class="tag">${t}</span>`).join('')}
            </div>
            `;
            card.onclick = () => window.open(url, '_blank');
            container.appendChild(card);
        });
    }
</script>
</body>
</html>
