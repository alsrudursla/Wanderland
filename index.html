<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanderland</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f7f3ec;
      --cream-dark: #ede7da;
      --ink: #1e1a16;
      --ink-light: #6b5f52;
      --ink-faint: #b5a99a;
      --accent: #c0392b;
      --line: #d4c9b0;
      --green: #2e7d32;
      --green-bg: #e8f5e9;
      --red: #c62828;
      --red-bg: #fce4ec;
    }

    body {
      background: var(--cream);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    header { text-align: center; margin-bottom: 36px; }

    .logo {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 42px;
      color: var(--ink);
      letter-spacing: 1px;
      line-height: 1;
    }

    .logo span { color: var(--accent); }

    .tagline {
      font-size: 13px;
      color: var(--ink-faint);
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    /* ── 메모지 카드 ── */
    .card {
      background: #fdfaf4;
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
      position: relative;
      box-shadow: 3px 4px 0 var(--cream-dark), 6px 8px 0 var(--line);
    }

    /* 노트 왼쪽 세로선 */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 32px;
      width: 1px; height: 100%;
      background: rgba(192, 57, 43, 0.15);
    }

    .section-title {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 20px;
      color: var(--ink);
      margin-bottom: 12px;
      padding-left: 20px;
    }

    /* ── 칩 영역 ── */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      padding-left: 20px;
    }

    .chip {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 18px;
      padding: 4px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--line);
      background: transparent;
      color: var(--ink-light);
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
      line-height: 1.6;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .chip:hover { border-color: var(--ink-light); }

    .chip.on {
      background: var(--ink);
      border-color: var(--ink);
      color: #fdfaf4;
    }

    .chip.accent.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* 커스텀 칩 X 버튼 */
    .chip-remove {
      font-size: 12px;
      opacity: 0.7;
      cursor: pointer;
      margin-left: 2px;
    }

    /* ── 직접 키워드 입력 ── */
    .keyword-input-row {
      display: flex;
      gap: 8px;
      padding-left: 20px;
      margin-bottom: 20px;
    }

    .keyword-input {
      flex: 1;
      font-family: 'Nanum Pen Script', cursive;
      font-size: 17px;
      padding: 6px 12px;
      border: 1.5px solid var(--line);
      border-radius: 20px;
      background: transparent;
      color: var(--ink);
      outline: none;
    }

    .keyword-input::placeholder { color: var(--ink-faint); }
    .keyword-input:focus { border-color: var(--ink-light); }

    .keyword-add-btn {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 16px;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--line);
      background: transparent;
      color: var(--ink-light);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .keyword-add-btn:hover {
      background: var(--ink);
      border-color: var(--ink);
      color: #fdfaf4;
    }

    .divider {
      border: none;
      border-top: 1px dashed var(--line);
      margin: 4px 0 20px;
    }

    .find-btn {
      width: calc(100% - 20px);
      margin-left: 20px;
      padding: 14px;
      font-family: 'Nanum Pen Script', cursive;
      font-size: 22px;
      background: var(--ink);
      color: #fdfaf4;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: transform 0.1s, background 0.1s;
    }

    .find-btn:active { transform: scale(0.98); }
    .find-btn:hover { background: #2c2520; }

    /* ── 로딩 ── */
    .loading {
      display: none;
      text-align: center;
      padding: 32px 0;
      font-family: 'Nanum Pen Script', cursive;
      font-size: 22px;
      color: var(--ink-light);
    }

    .loading.show { display: block; }

    /* ── 정렬 바 ── */
    .sort-bar {
      display: none;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 380px;
      margin: 16px 0 8px;
    }

    .sort-bar.show { display: flex; }
    .sort-btns { display: flex; gap: 8px; }

    .sort-btn {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink-light);
      cursor: pointer;
      transition: all 0.15s;
    }

    .sort-btn.on {
      background: var(--ink);
      border-color: var(--ink);
      color: #fdfaf4;
    }

    .feedback-link {
      font-size: 12px;
      color: var(--ink-faint);
      cursor: pointer;
      border-bottom: 1px dashed var(--line);
      padding-bottom: 1px;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      font-family: 'DM Sans', sans-serif;
    }

    .feedback-link:hover { color: var(--ink-light); }

    /* ── 반경 확장 안내 메시지 ── */
    .expand-notice {
      display: none;
      font-size: 12px;
      color: var(--ink-faint);
      text-align: center;
      margin-bottom: 8px;
      font-style: italic;
    }

    .expand-notice.show { display: block; }

    /* ── 결과 카드 ── */
    .results {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-card {
      background: #fdfaf4;
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 16px 18px;
      box-shadow: 2px 3px 0 var(--cream-dark);
      cursor: pointer;
      transition: transform 0.1s;
      animation: fadeUp 0.3s ease both;
    }

    .result-card:hover { transform: translateY(-2px); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-name {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 20px;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .result-meta {
      font-size: 12px;
      color: var(--ink-faint);
      margin-bottom: 8px;
    }

    .result-tags { display: flex; flex-wrap: wrap; gap: 6px; }

    .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--cream-dark);
      color: var(--ink-light);
    }

    .tag.open  { background: var(--green-bg); color: var(--green); }
    .tag.closed { background: var(--red-bg);  color: var(--red); }

    .no-result {
      text-align: center;
      font-family: 'Nanum Pen Script', cursive;
      font-size: 22px;
      color: var(--ink-faint);
      padding: 32px 0;
    }

    .error-msg {
      display: none;
      font-size: 13px;
      color: var(--accent);
      text-align: center;
      margin-top: 8px;
      padding-left: 20px;
    }

    .error-msg.show { display: block; }

    /* ── 피드백 모달 ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(30,26,22,0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.show { display: flex; }

    .modal {
      background: #fdfaf4;
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 28px 24px;
      width: 90%;
      max-width: 340px;
      box-shadow: 4px 6px 0 var(--line);
      position: relative;
    }

    .modal-title {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 24px;
      color: var(--ink);
      margin-bottom: 20px;
    }

    .modal-close {
      position: absolute;
      top: 12px; right: 16px;
      font-size: 20px;
      color: var(--ink-faint);
      cursor: pointer;
      background: none;
      border: none;
      font-family: 'DM Sans', sans-serif;
    }

    /* 별점 */
    .star-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .star {
      font-size: 28px;
      cursor: pointer;
      transition: transform 0.1s;
      filter: grayscale(1);
      opacity: 0.4;
    }

    .star.on { filter: grayscale(0); opacity: 1; }
    .star:hover { transform: scale(1.2); }

    .modal-label {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 18px;
      color: var(--ink-light);
      margin-bottom: 8px;
      display: block;
    }

    .modal-textarea {
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 10px 12px;
      border: 1.5px solid var(--line);
      border-radius: 4px;
      background: var(--cream);
      color: var(--ink);
      resize: none;
      outline: none;
      margin-bottom: 16px;
      height: 80px;
    }

    .modal-textarea:focus { border-color: var(--ink-light); }

    .modal-submit {
      width: 100%;
      padding: 12px;
      font-family: 'Nanum Pen Script', cursive;
      font-size: 20px;
      background: var(--ink);
      color: #fdfaf4;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.1s;
    }

    .modal-submit:hover { background: #2c2520; }
    .modal-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Wander<span>land</span></div>
    <p class="tagline">오늘 카페 어디가지?</p>
  </header>

  <div class="card">
    <!-- 섹션 1: 어떤 카페? (기본 칩) -->
    <p class="section-title">🏷 어떤 카페?</p>
    <div class="chips" id="type-chips">
      <span class="chip on"  data-value="카공">카공</span>
      <span class="chip"     data-value="빵집">빵집</span>
      <span class="chip"     data-value="조용한">조용한</span>
      <span class="chip"     data-value="분위기 좋은">분위기</span>
      <span class="chip"     data-value="데이트">데이트</span>
      <span class="chip"     data-value="대형">대형</span>
    </div>

    <hr class="divider">

    <!-- 섹션 2: 편의 시설 칩 -->
    <p class="section-title">✏️ 이런 거 있으면 좋겠어</p>
    <div class="chips" id="feature-chips">
      <span class="chip accent" data-value="콘센트">콘센트</span>
      <span class="chip accent" data-value="주차">주차</span>
      <span class="chip accent" data-value="애견동반">애견</span>
      <span class="chip accent" data-value="야외석">야외석</span>
    </div>

    <hr class="divider">

    <!-- 섹션 3: 직접 키워드 입력 → 칩으로 추가 -->
    <p class="section-title">🔍 직접 추가</p>
    <div class="keyword-input-row">
      <input
        class="keyword-input"
        id="keyword-input"
        type="text"
        placeholder="두쫀쿠, 우베, 흑당..."
        maxlength="20"
      >
      <button class="keyword-add-btn" onclick="addCustomChip()">+ 추가</button>
    </div>
    <!-- 사용자가 추가한 커스텀 칩들이 여기 들어감 -->
    <div class="chips" id="custom-chips"></div>

    <hr class="divider">
    <button class="find-btn" onclick="search()">찾아줘 →</button>
    <p class="error-msg" id="error-msg">위치 권한이 필요해요. 브라우저에서 허용해줘요!</p>
  </div>

  <div class="loading" id="loading">헤매는 중... 🗺</div>

  <!-- 정렬 바 + 피드백 버튼 -->
  <div class="sort-bar" id="sort-bar">
    <div class="sort-btns">
      <button class="sort-btn on" id="sort-distance" onclick="sortBy('distance')">가까운 순</button>
      <button class="sort-btn"    id="sort-rating"   onclick="sortBy('rating')">리뷰 순</button>
    </div>
    <button class="feedback-link" onclick="openFeedback()">피드백 남기기 ✏️</button>
  </div>

  <!-- 반경 확장 안내 -->
  <p class="expand-notice" id="expand-notice"></p>

  <div class="results" id="results"></div>

  <!-- 피드백 모달 -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <button class="modal-close" onclick="closeFeedback()">✕</button>
      <p class="modal-title">어떠셨어요? 🗒</p>

      <!-- 별점 -->
      <span class="modal-label">별점</span>
      <div class="star-row" id="star-row">
        <span class="star" data-v="1">⭐</span>
        <span class="star" data-v="2">⭐</span>
        <span class="star" data-v="3">⭐</span>
        <span class="star" data-v="4">⭐</span>
        <span class="star" data-v="5">⭐</span>
      </div>

      <!-- 자유 코멘트 -->
      <span class="modal-label">한 마디 (선택)</span>
      <textarea class="modal-textarea" id="feedback-comment" placeholder="불편한 점, 원하는 기능, 뭐든요!"></textarea>

      <button class="modal-submit" id="modal-submit" onclick="submitFeedback()">제출할게요 →</button>
    </div>
  </div>

<script>
  // ─────────────────────────────────────────────
  // 상태 (State)
  // ─────────────────────────────────────────────
  const state = {
    places: [],          // 검색 결과
    sort: 'distance',    // 현재 정렬 기준
    userLat: null,       // 현재 위치 위도
    userLng: null,       // 현재 위치 경도
    customChips: [],     // 사용자가 직접 추가한 칩 목록
    feedbackRating: 0    // 피드백 별점
  };

  // ─────────────────────────────────────────────
  // ChipManager: 칩 선택/추가/삭제 관리
  // ─────────────────────────────────────────────
  const ChipManager = {
    // 기본 칩 토글 (on/off)
    init() {
      document.querySelectorAll('#type-chips .chip, #feature-chips .chip').forEach(chip => {
        chip.addEventListener('click', () => chip.classList.toggle('on'));
      });

      // 키워드 입력창 엔터키로 추가
      document.getElementById('keyword-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') this.addCustom();
      });
    },

    // 선택된 칩의 data-value 배열 반환
    getSelected(groupId) {
      return [...document.querySelectorAll(`#${groupId} .chip.on`)]
        .map(c => c.dataset.value);
    },

    // 커스텀 칩 추가 (입력창 → 칩으로 변환)
    addCustom() {
      const input = document.getElementById('keyword-input');
      const val = input.value.trim();
      if (!val || state.customChips.includes(val)) return;

      state.customChips.push(val);

      const chip = document.createElement('span');
      chip.className = 'chip on accent';
      chip.dataset.value = val;
      chip.innerHTML = `${val} <span class="chip-remove" onclick="ChipManager.removeCustom('${val}', this.parentElement)">✕</span>`;

      document.getElementById('custom-chips').appendChild(chip);
      input.value = '';
    },

    // 커스텀 칩 삭제
    removeCustom(val, el) {
      state.customChips = state.customChips.filter(v => v !== val);
      el.remove();
    },

    // 현재 선택된 모든 키워드 (기본 + 편의 + 커스텀)
    getAllKeywords() {
      return [
        ...this.getSelected('type-chips'),
        ...this.getSelected('feature-chips'),
        ...state.customChips
      ];
    }
  };

  // ─────────────────────────────────────────────
  // GeoUtils: 거리 계산 유틸리티
  // ─────────────────────────────────────────────
  const GeoUtils = {
    // Haversine 공식으로 두 좌표 사이 거리(m) 계산
    distance(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLng / 2) ** 2;
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    },

    // 거리를 보기 좋게 포맷 (1000m 이상은 km)
    format(meters) {
      return meters >= 1000
        ? `${(meters / 1000).toFixed(1)}km`
        : `${meters}m`;
    }
  };

  // ─────────────────────────────────────────────
  // Sorter: 장소 정렬
  // ─────────────────────────────────────────────
  const Sorter = {
    byDistance(places) {
      return [...places].sort((a, b) => {
        // location 없는 장소는 맨 뒤로 (Infinity)
        const da = a.location
          ? GeoUtils.distance(state.userLat, state.userLng, a.location.latitude, a.location.longitude)
          : Infinity;
        const db = b.location
          ? GeoUtils.distance(state.userLat, state.userLng, b.location.latitude, b.location.longitude)
          : Infinity;
        return da - db;
      });
    },

    byRating(places) {
      return [...places].sort((a, b) =>
        (parseFloat(b.rating) || 0) - (parseFloat(a.rating) || 0)
      );
    },

    sort(places, type) {
      return type === 'rating' ? this.byRating(places) : this.byDistance(places);
    }
  };

  // ─────────────────────────────────────────────
  // Renderer: 결과 카드 렌더링
  // ─────────────────────────────────────────────
  const Renderer = {
    renderResults(places) {
      const container = document.getElementById('results');
      container.innerHTML = '';

      if (!places.length) {
        container.innerHTML = '<p class="no-result">근처에 카페가 없어요 😢</p>';
        return;
      }

      const keywords = ChipManager.getAllKeywords();

      places.forEach((place, i) => {
        const name    = place.displayName?.text || '';
        const address = place.formattedAddress || '';
        const rating  = place.rating
          ? `⭐ ${place.rating.toFixed(1)} (${place.userRatingCount}개)`
          : '';
        const dist = place.location
          ? GeoUtils.format(GeoUtils.distance(
              state.userLat, state.userLng,
              place.location.latitude, place.location.longitude
            ))
          : '';
        const url  = place.googleMapsUri || '';

        // 영업 중/종료 태그
        const isOpen = place.regularOpeningHours?.openNow;
        const openTag = isOpen === true
          ? '<span class="tag open">영업 중</span>'
          : isOpen === false
            ? '<span class="tag closed">영업 종료</span>'
            : '';

        const card = document.createElement('div');
        card.className = 'result-card';
        card.style.animationDelay = `${i * 0.05}s`;
        card.innerHTML = `
          <div class="result-name">${name}</div>
          <div class="result-meta">${[dist, rating, address].filter(Boolean).join(' · ')}</div>
          <div class="result-tags">
            ${openTag}
            ${keywords.map(k => `<span class="tag">${k}</span>`).join('')}
          </div>
        `;
        card.onclick = () => window.open(url, '_blank');
        container.appendChild(card);
      });
    }
  };

  // ─────────────────────────────────────────────
  // 검색 흐름
  // ─────────────────────────────────────────────

  // 현재 위치 가져오기 → 검색 시작
  function search() {
    const errorEl = document.getElementById('error-msg');
    errorEl.classList.remove('show');

    if (!navigator.geolocation) {
      errorEl.classList.add('show');
      return;
    }

    document.getElementById('loading').classList.add('show');
    document.getElementById('results').innerHTML = '';
    document.getElementById('sort-bar').classList.remove('show');
    document.getElementById('expand-notice').classList.remove('show');

    navigator.geolocation.getCurrentPosition(
      pos => {
        state.userLat = pos.coords.latitude;
        state.userLng = pos.coords.longitude;
        fetchPlaces();
      },
      () => {
        document.getElementById('loading').classList.remove('show');
        errorEl.classList.add('show');
      }
    );
  }

  // API 호출
  async function fetchPlaces() {
    const keywords = ChipManager.getAllKeywords();
    const keyword  = keywords.length ? keywords.join(' ') + ' 카페' : '카페';

    try {
      const res  = await fetch(
        `/api/search?lat=${state.userLat}&lng=${state.userLng}&keyword=${encodeURIComponent(keyword)}`
      );
      const data = await res.json();

      document.getElementById('loading').classList.remove('show');

      if (data.places?.length) {
        state.places = data.places;
        state.sort = 'distance';

        // 반경 확장 안내 메시지
        if (data.expandedRadius && data.expandedRadius > 1000) {
          const notice = document.getElementById('expand-notice');
          notice.textContent = `근처에 없어서 ${(data.expandedRadius / 1000).toFixed(1)}km 범위로 넓혀봤어요 🗺`;
          notice.classList.add('show');
        }

        document.getElementById('sort-distance').classList.add('on');
        document.getElementById('sort-rating').classList.remove('on');
        document.getElementById('sort-bar').classList.add('show');
        Renderer.renderResults(Sorter.sort(state.places, 'distance'));
      } else {
        document.getElementById('results').innerHTML = '<p class="no-result">근처에 카페가 없어요 😢</p>';
      }
    } catch {
      document.getElementById('loading').classList.remove('show');
      document.getElementById('results').innerHTML = '<p class="no-result">오류가 났어요 😢</p>';
    }
  }

  // 정렬 변경
  function sortBy(type) {
    state.sort = type;
    document.getElementById('sort-distance').classList.toggle('on', type === 'distance');
    document.getElementById('sort-rating').classList.toggle('on', type === 'rating');
    Renderer.renderResults(Sorter.sort(state.places, type));
  }

  // 커스텀 칩 추가 (버튼 클릭)
  function addCustomChip() { ChipManager.addCustom(); }

  // ─────────────────────────────────────────────
  // 피드백 모달
  // ─────────────────────────────────────────────

  function openFeedback() {
    document.getElementById('modal-overlay').classList.add('show');
  }

  function closeFeedback() {
    document.getElementById('modal-overlay').classList.remove('show');
    // 별점 초기화
    state.feedbackRating = 0;
    document.querySelectorAll('.star').forEach(s => s.classList.remove('on'));
    document.getElementById('feedback-comment').value = '';
  }

  // 별점 클릭
  document.querySelectorAll('.star').forEach(star => {
    star.addEventListener('click', () => {
      state.feedbackRating = parseInt(star.dataset.v);
      document.querySelectorAll('.star').forEach(s => {
        s.classList.toggle('on', parseInt(s.dataset.v) <= state.feedbackRating);
      });
    });
  });

  // 피드백 제출
  async function submitFeedback() {
    if (!state.feedbackRating) {
      alert('별점을 선택해줘요!');
      return;
    }

    const btn = document.getElementById('modal-submit');
    btn.disabled = true;
    btn.textContent = '제출 중...';

    await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        rating: state.feedbackRating,
        chips: ChipManager.getAllKeywords(),
        comment: document.getElementById('feedback-comment').value
      })
    });

    btn.textContent = '감사해요 🎉';
    setTimeout(() => {
      closeFeedback();
      btn.disabled = false;
      btn.textContent = '제출할게요 →';
    }, 1500);
  }

  // ─────────────────────────────────────────────
  // 초기화
  // ─────────────────────────────────────────────
  ChipManager.init();
</script>
</body>
</html>
