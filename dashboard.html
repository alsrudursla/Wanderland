<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanderland · 대시보드</title>
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* dashboard.html 전용: 통계 카드 내부 구성 */
    .card::before {
      content: '';
      position: absolute; top: 0; left: 28px;
      width: 1px; height: 100%;
      background: rgba(232, 137, 90, 0.15);
    }

    .card-title {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 22px; color: var(--ink);
      margin-bottom: 16px; padding-left: 16px;
    }

    .stat-row { display: flex; gap: 16px; padding-left: 16px; }
    .stat-box { flex: 1; background: var(--cream); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; }
    .stat-value { font-family: 'Nanum Pen Script', cursive; font-size: 32px; color: var(--ink); line-height: 1.1; }
    .stat-label { font-size: 11px; color: var(--ink-faint); margin-top: 4px; }

    .bar-list { display: flex; flex-direction: column; gap: 10px; padding-left: 16px; }
    .bar-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-light); margin-bottom: 4px; }
    .bar-track { height: 8px; background: var(--cream-dark); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.6s ease; }

    .comment-list { display: flex; flex-direction: column; gap: 12px; padding-left: 16px; }
    .comment-item { border-left: 2px solid var(--line); padding-left: 10px; }
    .comment-rating { font-size: 12px; color: var(--ink-faint); margin-bottom: 2px; }
    .comment-text { font-size: 13px; color: var(--ink); line-height: 1.5; }
    .comment-time { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

    .empty { font-size: 13px; color: var(--ink-faint); padding-left: 16px; }

    .loading-text {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 20px; color: var(--ink-faint);
      text-align: center; padding: 40px 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Wander<span>land</span> 대시보드</div>
    <a class="back-link" href="/">← 앱으로 돌아가기</a>
  </header>

  <p class="loading-text" id="loading-text">데이터 불러오는 중... 🗒</p>

  <!-- 총 피드백 + 평균 별점 -->
  <div class="card" id="card-summary" style="display:none">
    <p class="card-title">📊 전체 현황</p>
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-value" id="total-count">0</div>
        <div class="stat-label">총 피드백</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="avg-rating">-</div>
        <div class="stat-label">평균 별점</div>
      </div>
    </div>
  </div>

  <!-- 실제 검색 키워드 TOP (Redis 카운터) -->
  <div class="card" id="card-keywords" style="display:none">
    <p class="card-title">🔍 많이 검색한 키워드</p>
    <div class="bar-list" id="keyword-bar-list"></div>
  </div>

  <!-- 최근 코멘트 -->
  <div class="card" id="card-comments" style="display:none">
    <p class="card-title">✏️ 최근 코멘트</p>
    <div class="comment-list" id="comment-list"></div>
  </div>

  <script src="/js/dashboard.js"></script>
</body>
</html>
