<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanderland · 대시보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f7f3ec;
      --cream-dark: #ede7da;
      --ink: #1e1a16;
      --ink-light: #6b5f52;
      --ink-faint: #b5a99a;
      --accent: #c0392b;
      --line: #d4c9b0;
    }

    body {
      background: var(--cream);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
      gap: 20px;
    }

    header { text-align: center; }

    .logo { font-family: 'Nanum Pen Script', cursive; font-size: 36px; color: var(--ink); }
    .logo span { color: var(--accent); }

    .back-link {
      font-size: 13px; color: var(--ink-faint);
      text-decoration: none; border-bottom: 1px dashed var(--line);
      margin-top: 6px; display: inline-block;
    }

    .card {
      background: #fdfaf4;
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 24px;
      width: 100%; max-width: 380px;
      box-shadow: 3px 4px 0 var(--cream-dark);
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute; top: 0; left: 28px;
      width: 1px; height: 100%;
      background: rgba(192,57,43,0.12);
    }

    .card-title {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 22px; color: var(--ink);
      margin-bottom: 16px; padding-left: 16px;
    }

    /* ── 총 피드백 + 평균 별점 ── */
    .stat-row { display: flex; gap: 16px; padding-left: 16px; }

    .stat-box {
      flex: 1; background: var(--cream);
      border: 1px solid var(--line); border-radius: 4px;
      padding: 12px; text-align: center;
    }

    .stat-value { font-family: 'Nanum Pen Script', cursive; font-size: 32px; color: var(--ink); line-height: 1.1; }
    .stat-label { font-size: 11px; color: var(--ink-faint); margin-top: 4px; }

    /* ── 키워드 통계 바 ── */
    .bar-list { display: flex; flex-direction: column; gap: 10px; padding-left: 16px; }

    .bar-item {}

    .bar-label {
      display: flex; justify-content: space-between;
      font-size: 13px; color: var(--ink-light); margin-bottom: 4px;
    }

    .bar-track { height: 8px; background: var(--cream-dark); border-radius: 4px; overflow: hidden; }

    .bar-fill { height: 100%; background: var(--ink); border-radius: 4px; transition: width 0.6s ease; }

    /* ── 최근 코멘트 ── */
    .comment-list { display: flex; flex-direction: column; gap: 12px; padding-left: 16px; }

    .comment-item { border-left: 2px solid var(--line); padding-left: 10px; }
    .comment-rating { font-size: 12px; color: var(--ink-faint); margin-bottom: 2px; }
    .comment-text  { font-size: 13px; color: var(--ink); line-height: 1.5; }
    .comment-time  { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

    .empty { font-size: 13px; color: var(--ink-faint); padding-left: 16px; }

    .loading-text {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 20px; color: var(--ink-faint);
      text-align: center; padding: 40px 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Wander<span>land</span> 대시보드</div>
    <a class="back-link" href="/">← 앱으로 돌아가기</a>
  </header>

  <p class="loading-text" id="loading-text">데이터 불러오는 중... 🗒</p>

  <!-- 총 피드백 + 평균 별점 -->
  <div class="card" id="card-summary" style="display:none">
    <p class="card-title">📊 전체 현황</p>
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-value" id="total-count">0</div>
        <div class="stat-label">총 피드백</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="avg-rating">-</div>
        <div class="stat-label">평균 별점</div>
      </div>
    </div>
  </div>

  <!-- 실제 검색 키워드 TOP (Redis 카운터) -->
  <div class="card" id="card-keywords" style="display:none">
    <p class="card-title">🔍 많이 검색한 키워드</p>
    <div class="bar-list" id="keyword-bar-list"></div>
  </div>

  <!-- 최근 코멘트 -->
  <div class="card" id="card-comments" style="display:none">
    <p class="card-title">✏️ 최근 코멘트</p>
    <div class="comment-list" id="comment-list"></div>
  </div>

<script>
  // ─────────────────────────────────────────────
  // DashboardRenderer: 대시보드 UI 렌더링
  // ─────────────────────────────────────────────
  class DashboardRenderer {
    constructor(data) {
      this.data = data;
      // data: { total, averageRating, recentComments, keywordStats }
    }

    renderSummary() {
      document.getElementById('total-count').textContent = this.data.total;
      document.getElementById('avg-rating').textContent  =
        this.data.total > 0 ? `⭐ ${this.data.averageRating}` : '-';
      document.getElementById('card-summary').style.display = '';
    }

    // Redis 키워드 카운터 기반 바 차트
    renderKeywordStats() {
      const list  = document.getElementById('keyword-bar-list');
      const stats = this.data.keywordStats || [];

      if (!stats.length) {
        list.innerHTML = '<p class="empty">아직 검색 데이터가 없어요</p>';
        document.getElementById('card-keywords').style.display = '';
        return;
      }

      const max = stats[0].count; // 가장 많은 수 = 100% 기준

      list.innerHTML = stats.slice(0, 10).map(({ keyword, count }) => `
        <div class="bar-item">
          <div class="bar-label">
            <span>${keyword.replace(/ 카페$/, '')}</span>
            <span>${count}회</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${(count / max * 100).toFixed(1)}%"></div>
          </div>
        </div>
      `).join('');

      document.getElementById('card-keywords').style.display = '';
    }

    renderComments() {
      const list     = document.getElementById('comment-list');
      const comments = this.data.recentComments || [];

      if (!comments.length) {
        list.innerHTML = '<p class="empty">아직 코멘트가 없어요</p>';
        document.getElementById('card-comments').style.display = '';
        return;
      }

      list.innerHTML = comments.map(({ timestamp, rating, comment }) => `
        <div class="comment-item">
          <div class="comment-rating">${'⭐'.repeat(parseInt(rating) || 0)}</div>
          <div class="comment-text">${comment}</div>
          <div class="comment-time">${timestamp}</div>
        </div>
      `).join('');

      document.getElementById('card-comments').style.display = '';
    }

    render() {
      this.renderSummary();
      this.renderKeywordStats();
      this.renderComments();
    }
  }

  // 데이터 로드
  async function loadDashboard() {
    try {
      const res  = await fetch('/api/feedback-data');
      const data = await res.json();
      document.getElementById('loading-text').style.display = 'none';
      new DashboardRenderer(data).render();
    } catch {
      document.getElementById('loading-text').textContent = '데이터를 불러오지 못했어요 😢';
    }
  }

  loadDashboard();
</script>
</body>
</html>
